<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoderCoaster</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; color: #fff;
           background: linear-gradient(135deg, #6a11cb, #2575fc); }
    main { text-align: center; }
    h1 { font-size: 3rem; margin: 0 0 .5rem; }
    button { padding: .7rem 1.4rem; border: 0; border-radius: 999px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>🎢 CoderCoaster</h1>
    <p id="msg">¡Hola mundo! Sitio en construcción.</p>
    <button onclick="document.getElementById('msg').textContent = ['¡Wiii!','Subiendo...','¡Bajando!','Loop!'][Math.floor(Math.random()*4)]">Subirme</button>
  </main>
</body>
</html>
