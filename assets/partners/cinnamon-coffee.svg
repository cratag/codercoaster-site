<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cinnamon Coffee">
  <!-- Single-ink silhouette of cinnamon-coffee/assets/logo.svg: the marquee uses logos as
       masks, so the cream areas are knocked out (black in the mask) and every ink stays opaque -->
  <defs>
    <path id="top" d="M 34 100 A 66 66 0 0 1 166 100" />
    <path id="bottom" d="M 26 100 A 74 74 0 0 0 174 100" />
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <circle cx="100" cy="100" r="96" fill="#fff" />
      <circle cx="100" cy="100" r="90" fill="#000" />
      <circle cx="100" cy="100" r="84" fill="none" stroke="#fff" stroke-width="5" />
      <path d="M 16 100 A 84 84 0 0 0 184 100 Z" fill="#fff" />
      <circle cx="100" cy="100" r="50" fill="#000" stroke="#fff" stroke-width="5" />
      <text font-family="Georgia, serif" font-size="21" font-weight="700" letter-spacing="3" fill="#fff">
        <textPath href="#top" startOffset="50%" text-anchor="middle">CINNAMON</textPath>
      </text>
      <text font-family="Georgia, serif" font-size="15" font-weight="700" letter-spacing="3" fill="#000">
        <textPath href="#bottom" startOffset="50%" text-anchor="middle">COFFEE</textPath>
      </text>
      <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 78 104 h 38 v 6 a 19 19 0 0 1 -38 0 z" />
        <path d="M 116 108 a 7 7 0 0 1 0 14" />
        <path d="M 72 132 h 50" />
        <path d="M 95 98 c -8 -8 8 -12 0 -22 c -6 -7 4 -10 2 -16" />
      </g>
    </mask>
  </defs>
  <rect width="200" height="200" fill="#000" mask="url(#m)" />
</svg>
